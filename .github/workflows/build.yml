name: Build

on:
  push:

jobs:
  Linux:
    # local runner, inside a container so apt stays off the host
    runs-on: [self-hosted, lumavault]
    container: ubuntu:24.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential git ca-certificates cmake libsdl2-dev libsdl2-ttf-dev
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: |
          mkdir laserkombat && cd laserkombat
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          strip --strip-unneeded laserkombat
          cp ../COPYING ./
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: laserkombat-linux
          path: |
            laserkombat/laserkombat
            laserkombat/assets
            laserkombat/COPYING

  Windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_ttf
          update: true
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: |
          mkdir laserkombat && cd laserkombat
          cmake -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles" ..
          cmake --build .
          strip --strip-unneeded laserkombat.exe
          cp ../COPYING ./
          ../platform/windows/create-license-directory.sh mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL2_ttf
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: laserkombat-windows
          path: |
            laserkombat/laserkombat.exe
            laserkombat/assets
            laserkombat/COPYING
            laserkombat/third-party-licenses

  PSP:
    runs-on: [self-hosted, lumavault]
    container: pspdev/pspdev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: |
          mkdir laserkombat && cd laserkombat
          psp-cmake -DCMAKE_BUILD_TYPE=Release ..
          make
          cp ../COPYING ./
          psp-create-license-directory sdl2 sdl2-ttf
      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: laserkombat-psp
          path: |
            laserkombat/EBOOT.PBP
            laserkombat/assets
            laserkombat/COPYING
            laserkombat/third-party-licenses

  Release:
    needs: [Linux, Windows, PSP]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, lumavault]
    container: ubuntu:24.04
    strategy:
      matrix:
        build: [linux, windows, psp]
    steps:
    - name: Container tools
      run: apt-get update && apt-get install -y --no-install-recommends zip ca-certificates
    - uses: actions/download-artifact@v8
    - name: Zip artifacts
      run: |
        zip -r laserkombat-${{matrix.build}}.zip laserkombat-${{matrix.build}}
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: laserkombat-${{matrix.build}}.zip
        tag_name: ${{ github.ref_name }}
        name: Laser Kombat Revised version ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
