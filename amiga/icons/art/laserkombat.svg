<?xml version="1.0" encoding="UTF-8"?>
<!-- Laser Kombat GlowIcon art: a green tank firing its laser into a mirror.
     The AmiCradle Team's own drawing; GPL 3, like the other Amiga files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8f29a"/>
      <stop offset="0.5" stop-color="#5fb13a"/>
      <stop offset="1" stop-color="#25601a"/>
    </linearGradient>
    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b9d4f0"/>
      <stop offset="1" stop-color="#5d7fa8"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="1" stop-color="#a81e12"/>
    </linearGradient>
  </defs>
  <!-- the laser: out of the gun, off the mirror, up -->
  <path d="M62 92 L100 92 L100 22" fill="none" stroke="#ff2a2a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 92 L100 92 L100 22" fill="none" stroke="#fff0c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the mirror on its block -->
  <rect x="86" y="78" width="28" height="28" rx="3" fill="url(#block)" stroke="#4a0a04" stroke-width="3"/>
  <path d="M88 104 L112 80" stroke="url(#mirror)" stroke-width="8" stroke-linecap="round"/>
  <path d="M88 104 L112 80" stroke="#1c2f52" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- the tank, facing right -->
  <rect x="10" y="98" width="52" height="14" rx="7" fill="#3a3a3a" stroke="#111" stroke-width="3"/>
  <circle cx="20" cy="105" r="3" fill="#888"/><circle cx="36" cy="105" r="3" fill="#888"/><circle cx="52" cy="105" r="3" fill="#888"/>
  <rect x="14" y="78" width="44" height="22" rx="5" fill="url(#body)" stroke="#173d0f" stroke-width="3"/>
  <rect x="48" y="86" width="20" height="8" rx="2" fill="url(#body)" stroke="#173d0f" stroke-width="2.5"/>
  <circle cx="34" cy="86" r="9" fill="url(#body)" stroke="#173d0f" stroke-width="3"/>
</svg>
